<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(ellipse at bottom, #2b3b4d 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            padding: 20px;
            overflow-x: hidden; /* Prevent horizontal scroll during animation */
        }

        /* Twinkling Star Background */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.1; } to { opacity: 1; transform: scale(1.1); } }

        /* Frosted Glass Card */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1); /* Custom, smooth opening */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            background: linear-gradient(to right, #ffb3c6, #ff8fab, #fb6f92);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p#intro-text {
            font-size: 1.1em;
            font-weight: 300;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        /* Glow Button */
        .btn {
            background: linear-gradient(45deg, #ff8fab, #fb6f92);
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(251, 111, 146, 0.4);
        }

        .btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 30px rgba(251, 111, 146, 0.7);
        }

        /* Hidden Gallery Section */
        #secret-gallery {
            display: none;
            margin-top: 30px;
            animation: slideInFromBottom 1s ease-out forwards;
        }

        @keyframes slideInFromBottom {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Photo Layout (Sleek modern gallery) */
        .photo-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .photo-grid img {
            width: 45%;
            min-width: 200px;
            border-radius: 12px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .photo-grid img:hover {
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .love-note {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 600;
            font-style: italic;
            color: #ffb3c6;
            text-shadow: 0 0 15px rgba(255, 179, 198, 0.6);
        }

        /* Confetti Particles (Generated by JS) */
        .confetti-particle {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 100;
            pointer-events: none;
            opacity: 1;
            border-radius: 50%;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars" id="star-container"></div>

    <div class="glass-card" id="main-card">
        <h1>Happy Birthday, Rai cutie baby</h1>
        <p id="intro-text">Thank you for being the brightest star in my sky. open it now rai chapri...</p>
        
        <button class="btn" id="surpriseBtn" onclick="triggerCelebration()">Open my heart 💖</button>
        
        <div id="secret-gallery">
            <p>This is us in like few months.</p>
            <div class="photo-grid">
                
                <img src="pic1.jpg" alt="Memory 1">
                <img src="pic2.jpg" alt="Memory 2">
                <img src="pic3.jpg" alt="Memory 3">
                
            </div>
            <p class="love-note">I love you more than words can say. Happy Birthday suar mwahhhhh! ❤️</p>
        </div>
    </div>

    <script>
        // 1. Generate Star Background
        const container = document.getElementById('star-container');
        for (let i = 0; i < 150; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            let size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(star);
        }

        // 2. Trigger Celebration Effect
        function triggerCelebration() {
            // A. Hide initial content
            document.getElementById('surpriseBtn').style.display = 'none';
            document.getElementById('intro-text').style.display = 'none';

            // B. Transition the main card (Make it wider for photos)
            const card = document.getElementById('main-card');
            card.style.maxWidth = '900px';
            card.style.paddingTop = '60px'; // Shift content down slightly

            // C. Fire the Confetti Cannon (Dramatic effect)
            for (let i = 0; i < 100; i++) {
                createConfettiParticle();
            }

            // D. Reveal hidden photo gallery smoothly
            document.getElementById('secret-gallery').style.display = 'block';
        }

        // 3. Create single confetti particle
        function createConfettiParticle() {
            const colors = ['#ff8fab', '#fb6f92', '#ffffff', '#ffd166', '#a2d2ff'];
            const particle = document.createElement('div');
            particle.className = 'confetti-particle';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Random start position near center (cannon effect)
            particle.style.left = `calc(50vw + ${Math.random() * 100 - 50}px)`;
            particle.style.top = `calc(50vh + ${Math.random() * 100 - 50}px)`;
            
            // Random speed and movement path
            particle.style.animationDuration = Math.random() * 2 + 2 + 's';
            particle.style.animationDelay = Math.random() * 0.2 + 's';
            
            // Add CSS logic dynamics for randomized physics-like scatter
            const dx = Math.random() * 300 - 150; // Random X scatter
            particle.style.setProperty('--dx', dx + 'px');
            
            // Define custom keyframes for the horizontal scatter dynamics
            const style = document.createElement('style');
            style.innerHTML = `@keyframes fall {
                0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
                20% { transform: translateY(-50px) translateX(${dx/2}px) rotate(${dx}deg); }
                100% { transform: translateY(110vh) translateX(${dx}px) rotate(${dx*2}deg); opacity: 0; }
            }`;
            document.head.appendChild(style);

            document.body.appendChild(particle);
            
            // Clean up particle after animation
            setTimeout(() => {
                particle.remove();
            }, 4000);
        }
    </script>
</body>
</html>
